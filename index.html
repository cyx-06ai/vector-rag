<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>知识库问答</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; }
    .bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; margin: 8px 0; white-space: pre-wrap; }
    .me { background: #95ec69; margin-left: auto; }
    .bot { background: #ffffff; margin-right: auto; }
    #bar { display: flex; padding: 10px; background: #fff; }
    #inp { flex: 1; padding: 10px; font-size: 16px; }
    #btn { padding: 10px 20px; margin-left: 8px; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <div id="bar">
    <input id="inp" placeholder="输入问题，回车发送">
    <button id="btn">发送</button>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const inp = document.getElementById("inp");

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const q = inp.value.trim();
      if (q === "") return;
      addBubble(q, "me");
      inp.value = "";
      addBubble("思考中...", "bot");
      const r = await fetch("/ask?q=" + encodeURIComponent(q));
      const data = await r.json();
      chat.lastChild.textContent = data.reply;
    }

    document.getElementById("btn").onclick = send;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
